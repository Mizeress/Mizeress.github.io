
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Samuel Mallia - Portfolio</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons (for PDF icon) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>


<body>
  <main class="container py-5">

    <!-- placeholder for shared navigation -->
    <div id="siteNav" aria-hidden="false"></div>

    <div class="d-flex justify-content-end align-items-start">
        <button id="appearanceToggle" class="toggle-btn" aria-pressed="true" title="Toggle appearance">
          <i id="toggleIcon" class="bi"></i>
          <span id="toggleLabel"></span>
        </button>
    </div>


    <div class="row align-items-center g-4">
      <!-- Image column -->
      <div class="col-12 col-md-4 text-center text-md-start">
        <img src="images/PfP.jpg" alt="Samuel Mallia profile" class="img-thumbnail profile-img">
      </div>

      <!-- Main content column -->
      <div class="col-12 col-md-8">
        <header>
          <h1 class="mb-1">Samuel Mallia</h1>
          <div class="job-field">Software Engineer</div>
          <div class="mb-3">
            <a class="btn btn-outline-primary" href="resumes/resume.pdf" target="_blank" rel="noopener">
              <i class="bi bi-file-earmark-pdf"></i> Resume
            </a>
          </div>
        </header>
      </div>
    </div>
  </main>

  <!-- Bootstrap 5 JS (optional, for components) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

  <!--Script for switching between light and dark mode-->
  <script src="js/theme.js"></script>

  <script src="js/load-nav.js"></script>
</body>
</html>
